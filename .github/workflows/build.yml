name: Build directory

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 02:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-directory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch iptv-org sources
        run: |
          git clone -q --depth 1 https://github.com/iptv-org/database ../database
          git clone -q --depth 1 https://github.com/iptv-org/iptv ../iptv
          echo "DATABASE_SHA=$(git -C ../database rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "IPTV_SHA=$(git -C ../iptv rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: python scripts/build.py --data ../database/data --streams ../iptv/streams --out dist --probe

      # Generated playlists live on the dist branch; main only holds code and policy.
      - name: Publish to dist branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ../LICENSE ../POLICY.md .
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Directory build from iptv-org/database@${DATABASE_SHA} iptv-org/iptv@${IPTV_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist

      # jsDelivr caches branch files for hours; ask it to refresh the files people load first.
      - name: Refresh jsDelivr cache
        continue-on-error: true
        run: |
          for f in index.json index.m3u; do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@dist/${f}"
          done
